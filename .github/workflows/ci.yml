name: Python CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-forbidden-folders:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v7

    - name: Check for forbidden folders in PR
      run: |
        echo "Checking for forbidden folders in pull request..."

        # Function to check for folder existence case-insensitively
        check_forbidden_folder() {
          local pattern="$1"
          local description="$2"

          # Use find with case-insensitive matching
          if find . -type d -ipath "*${pattern}*" -print -quit | grep -q .; then
            echo "❌ ERROR: Found forbidden folder matching '${pattern}'"
            echo "Description: ${description}"
            find . -type d -ipath "*${pattern}*" | sed 's/^/ Found: /'
            return 1
          else
            echo "✅ No forbidden folder found for pattern: ${pattern}"
            return 0
          fi
        }

        # Check for forbidden folders
        ERROR=0

        check_forbidden_folder "pr_info" "Temporary development folder (planning, tracking, review logs)" || ERROR=1
        check_forbidden_folder ".scratch" "Agent scratch probes (throwaway tests) - delete after the experiment" || ERROR=1

        if [ $ERROR -eq 1 ]; then
          echo ""
          echo "❌ PULL REQUEST BLOCKED: Forbidden folders detected!"
          echo "These folders should not be included in pull requests."
          echo "Please remove them and update your .gitignore if necessary."
          echo "Note: These folders are allowed in regular commits, just not in PRs."
          exit 1
        else
          echo ""
          echo "✅ All checks passed! No forbidden folders found."
        fi

  # Matrix approach: Each check runs as independent job with individual pass/fail status
  # fail-fast: false ensures all checks complete even if one fails
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - {name: "black", cmd: "black --version && black --check src tests tools"}
          - {name: "isort", cmd: "isort --version && isort --check --profile=black --float-to-top src tests tools"}
          - {name: "pylint", cmd: "pylint --version && pylint ./src ./tests"}  # configuration via pyproject.toml
          - {name: "ruff", cmd: "ruff version && ruff check src tests tools"}
          - {name: "mypy", cmd: "mypy --version && mypy --strict src tests"}
          - {name: "no-url-deps", cmd: "python tools/check_no_url_deps.py"}
          - {name: "file-size", cmd: "mcp-coder check file-size --max-lines 750 --allowlist-file .large-files-allowlist"}
    name: ${{ matrix.check.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        # GitHub-installed deps come from [tool.mcp-coder.install-from-github]
        # in pyproject.toml (installed in the same uv call so they win over PyPI).
        run: |
          mapfile -t SPECS < <(python tools/read_github_deps.py --specs)
          uv pip install --system "${SPECS[@]}" ".[dev]"

      - name: Environment info
        run: |
          uname -a
          python --version
          uv --version
          git --version

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}

  # Unit tests (with coverage data for the combined report)
  unit-tests:
    runs-on: ubuntu-latest
    name: unit-tests
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        # GitHub deps from [tool.mcp-coder.install-from-github] — see the `test` job.
        run: |
          mapfile -t SPECS < <(python tools/read_github_deps.py --specs)
          uv pip install --system "${SPECS[@]}" ".[dev]"

      - name: Run unit tests
        env:
          COVERAGE_FILE: .coverage.unit
        run: pytest --version && pytest tests -m 'not sqlite_integration and not mssql_integration and not postgresql_integration' --cov=src/mcp_tools_sql --cov-report=

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-unit
          path: .coverage.unit
          include-hidden-files: true
          retention-days: 1

  # SQLite integration tests (always available, no service container needed)
  sqlite-integration:
    runs-on: ubuntu-latest
    name: sqlite-integration
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        # GitHub deps from [tool.mcp-coder.install-from-github] — see the `test` job.
        run: |
          mapfile -t SPECS < <(python tools/read_github_deps.py --specs)
          uv pip install --system "${SPECS[@]}" ".[dev]"

      - name: Run SQLite integration tests
        env:
          COVERAGE_FILE: .coverage.sqlite
        run: |
          rc=0; pytest tests -m sqlite_integration -v --cov=src/mcp_tools_sql --cov-report= || rc=$?
          if [ $rc -eq 5 ]; then echo "No tests collected — skipping"; exit 0; fi
          exit $rc

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-sqlite
          path: .coverage.sqlite
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  # PostgreSQL integration tests
  postgresql-integration:
    runs-on: ubuntu-latest
    name: postgresql-integration
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        # GitHub deps from [tool.mcp-coder.install-from-github] — see the `test` job.
        run: |
          mapfile -t SPECS < <(python tools/read_github_deps.py --specs)
          uv pip install --system "${SPECS[@]}" ".[dev,postgresql]"

      - name: Run PostgreSQL integration tests
        env:
          TEST_PG_HOST: localhost
          TEST_PG_PORT: 5432
          TEST_PG_USER: testuser
          TEST_PG_PASSWORD: testpass
          TEST_PG_DB: testdb
          COVERAGE_FILE: .coverage.postgresql
        run: |
          rc=0; pytest tests -m postgresql_integration -v --cov=src/mcp_tools_sql --cov-report= || rc=$?
          if [ $rc -eq 5 ]; then echo "No tests collected — skipping"; exit 0; fi
          exit $rc

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-postgresql
          path: .coverage.postgresql
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  # MSSQL integration tests (best-effort)
  mssql-integration:
    runs-on: ubuntu-latest
    name: mssql-integration
    continue-on-error: true
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "TestPass123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TestPass123!' -C -Q 'SELECT 1'"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=10
          --health-start-period=30s
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install dependencies
        # GitHub deps from [tool.mcp-coder.install-from-github] — see the `test` job.
        run: |
          mapfile -t SPECS < <(python tools/read_github_deps.py --specs)
          uv pip install --system "${SPECS[@]}" ".[dev,mssql]"

      - name: ODBC diagnostics
        run: |
          echo "--- odbcinst -j ---"
          odbcinst -j || true
          echo "--- odbcinst -q -d (installed drivers) ---"
          odbcinst -q -d || true
          echo "--- pyodbc.drivers() ---"
          python -c "import pyodbc; print(pyodbc.drivers())"

      - name: Run MSSQL integration tests
        env:
          TEST_MSSQL_HOST: localhost
          TEST_MSSQL_PORT: 1433
          TEST_MSSQL_USER: sa
          TEST_MSSQL_PASSWORD: "TestPass123!"
          COVERAGE_FILE: .coverage.mssql
        run: |
          rc=0; pytest tests -m mssql_integration -v --cov=src/mcp_tools_sql --cov-report= || rc=$?
          if [ $rc -eq 5 ]; then echo "No tests collected — skipping"; exit 0; fi
          exit $rc

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-mssql
          path: .coverage.mssql
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  # Coverage report (reporting only — never a gate)
  coverage:
    runs-on: ubuntu-latest
    needs: [unit-tests, sqlite-integration, postgresql-integration, mssql-integration]
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install coverage tools
        run: pip install coverage diff-cover

      - name: Download coverage data
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Coverage report
        run: |
          if ! { [ -n "$(ls -A coverage-data 2>/dev/null)" ] \
                 && coverage combine coverage-data \
                 && coverage xml -o coverage.xml; }; then
            echo "_No coverage data for this run; coverage report skipped._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff-cover coverage.xml \
              --compare-branch=origin/${{ github.base_ref }} \
              --format markdown:diff-coverage.md || true
          fi
          args=(--coverage-xml coverage.xml --output "$GITHUB_STEP_SUMMARY")
          if [ -f diff-coverage.md ]; then args+=(--diff-report diff-coverage.md); fi
          python tools/ci_coverage_summary.py "${args[@]}"

  # Architecture and code quality checks (PR only)
  architecture:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        check:
          - {name: "import-linter", cmd: "lint-imports --help > /dev/null && ./tools/lint_imports.sh"}
          - {name: "tach", cmd: "tach --version && ./tools/tach_check.sh"}
          - {name: "vulture", cmd: "vulture --version && ./tools/vulture_check.sh"}
          - {name: "pycycle", cmd: "pycycle --version && ./tools/pycycle_check.sh"}
          - {name: "deptry", cmd: "deptry --version && ./tools/deptry_check.sh"}
    name: ${{ matrix.check.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        # GitHub deps from [tool.mcp-coder.install-from-github] — see the `test` job.
        run: |
          mapfile -t SPECS < <(python tools/read_github_deps.py --specs)
          uv pip install --system "${SPECS[@]}" ".[dev]"

      - name: Environment info
        run: |
          uname -a
          python --version
          uv --version
          git --version

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}
