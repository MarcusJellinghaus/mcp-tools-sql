[project]
name = "mcp-tools-sql"
dynamic = ["version"]
authors = [
    {name = "Marcus Jellinghaus"},
]
description = "An MCP server for safe, configurable SQL database access"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["mcp", "sql", "database", "llm", "claude", "ai", "sql-server", "postgresql", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # <2.0.0: mcp 2.x drops mcp.server.fastmcp (FastMCP -> MCPServer). See #46.
    "mcp>=1.3.0,<2.0.0",
    "mcp[cli]>=1.3.0,<2.0.0",
    "mcp-coder-utils>=0.1.6.dev0",
    "tabulate>=0.9.0",
    "pydantic>=2.0",
    "tomlkit>=0.13.0",
    "sqlglot>=30",
]

[project.optional-dependencies]
mssql = ["pyodbc>=5.0.0"]
postgresql = ["psycopg[binary]>=3.1.0"]
all-backends = [
    "pyodbc>=5.0.0",
    "psycopg[binary]>=3.1.0",
]
dev = [
    "mcp-workspace",
    "mcp-coder",
    "mcp-tools-py",        # single source for ruff (lint + format)/pylint/mypy/vulture/pytest...
    "tach>=0.35.0",        # KEEP — mcp-tools-py ships it only in its own [dev] extra
    "deptry>=0.25.1",
    "pytest-cov",
    "diff-cover",
]

[project.scripts]
mcp-tools-sql = "mcp_tools_sql.main:main"

[project.urls]
"Homepage" = "https://github.com/MarcusJellinghaus/mcp-tools-sql"
"Bug Tracker" = "https://github.com/MarcusJellinghaus/mcp-tools-sql/issues"
"Documentation" = "https://github.com/MarcusJellinghaus/mcp-tools-sql#readme"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
# --strict-markers: unknown markers are errors (catches typos)
# -p no:tach: Disable tach plugin (noisy output about unaffected tests)
addopts = ["--strict-markers", "--tb=short", "-n", "auto", "-p", "no:tach"]
markers = [
    "sqlite_integration: Integration tests using SQLite",
    "mssql_integration: Integration tests using Microsoft SQL Server",
    "postgresql_integration: Integration tests using PostgreSQL",
    "integration: General integration tests requiring external resources",
]

# Run as `deptry src` (tools/deptry_check.sh) — src only; tests/ and tools/ are not scanned.
[tool.deptry]
known_first_party = ["mcp_tools_sql"]
# Packages in the `dev` extra are tooling, not runtime deps: no DEP002 for them,
# but importing one from src/ is still reported (DEP004).
optional_dependencies_dev_groups = ["dev"]

# pyodbc / psycopg are absent in `.[dev]`-only installs (the CI `architecture` job),
# so deptry cannot read their metadata; name the modules explicitly.
[tool.deptry.package_module_name_map]
pyodbc = ["pyodbc"]
psycopg = ["psycopg"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pytest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcp.server.fastmcp"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcp_coder_utils", "mcp_coder_utils.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tabulate", "tabulate.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyodbc", "pyodbc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sqlglot", "sqlglot.*"]
ignore_missing_imports = true

# Optional backend dependency: installed in some environments, not others.
# An override (unlike an inline ignore) is never reported as unused.
[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.format]

[tool.ruff.lint]
# preview needed for DOC rules (pydoclint)
#
# TRY, EM, PL (except PLW1510) rejected — see mcp_coder #1172, #1181.
preview = true
explicit-preview-rules = true   # preview rules fire only when selected by exact code
select = [
    "D",
    "ANN",
    # DOC rules are preview-only; with explicit-preview-rules they must be
    # listed by exact code — a bare "DOC" prefix silently enforces nothing.
    "DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "DOC502",
    "SIM",
    # SIM905 is preview-only; see explicit-preview-rules note above.
    "SIM905",
    "E",
    "F",
    "C4", "B",
    "S",
    "UP",
    "I",
    # PLW1510 only: the PL prefix would re-enable pylint's disabled R category (PLR09xx).
    "PLW1510",
    # PLE2502 bidirectional-unicode: covers bandit B613 (trojansource), which has no S port.
    "PLE2502",
]
ignore = [
    "D107",  # missing docstring in __init__ method (redundant with class docstring)
    "ANN401",  # Any is correct at library/CLI boundaries; mypy strict covers the rest
    "E501",  # line length is owned by the formatter (ruff format); not re-checked here
]

[tool.ruff.lint.per-file-ignores]
# tests: assert is the pytest idiom (S101); S105/S106/S108 fire on fake
# credentials and "/tmp/..." literals used as test data, never opened;
# S608: DDL/DML fixtures build SQL from strings on purpose.
"tests/**/*.py" = ["D", "DOC", "SIM117", "S101", "S105", "S106", "S108", "S608"]
# tools: standalone CI scripts copied from mcp_coder; Returns sections not required.
"tools/**" = ["DOC201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pylint.messages_control]
disable = [
    "C",       # conventions — not enabled in this project
    "R",       # refactor suggestions — not enabled in this project
    "W1203",   # logging-fstring-interpolation — project uses f-strings for readability
    "W0621",   # redefined-outer-name — standard pytest fixture pattern
    "W0511",   # fixme/TODO — informational only, not a quality gate
    "W0212",   # protected-access — legitimate in tests and controlled src usage
    "W0613",   # unused-argument — pytest fixtures injected by name
    "W0611",   # unused-import — owned by ruff F401 (pylint flags the X-as-X re-export convention)
    "W0404",   # reimported — reimports across test functions
    "W0718",   # broad-exception-caught — intentional catch-all in CLI/workflow error handling
    "W0706",   # try-except-raise — explicit re-raise for clarity in error chains
    "W4903",   # deprecated-argument — tracked for future cleanup
]
enable = ["R0401"]

[tool.pylint.main]
# pyodbc is a C extension; let pylint import it to see its members (I1101).
extension-pkg-allow-list = ["pyodbc"]

[tool.pylint.typecheck]
# sqlglot builds its ``exp`` expression classes dynamically; treat it as an
# ignored module so pylint neither attempts the import nor flags dynamic members.
ignored-modules = ["sqlglot"]

[tool.mcp-tools-py]
# Formatter for run_format_code and mcp-coder workflows: ruff (import sorting + ruff format)
formatter = "ruff"

[tool.mcp-coder.implement]
format_code = true
check_type_hints = true

[tool.mcp-coder.install-from-github]
# All installed together WITH deps — uv resolves siblings in one pass
packages = [
    "mcp-coder-utils @ git+https://github.com/MarcusJellinghaus/mcp-coder-utils.git",
    # "mcp-config-tool @ git+https://github.com/MarcusJellinghaus/mcp-config.git",
    # "mcp-workspace @ git+https://github.com/MarcusJellinghaus/mcp-workspace.git",
    # "mcp-coder @ git+https://github.com/MarcusJellinghaus/mcp_coder.git",
]

# Include tools directory in the distribution
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.toml"]

[tool.uv.sources]
mcp-coder-utils = { git = "https://github.com/MarcusJellinghaus/mcp-coder-utils.git" }
# mcp-config-tool = { git = "https://github.com/MarcusJellinghaus/mcp-config.git" }
# mcp-workspace = { git = "https://github.com/MarcusJellinghaus/mcp-workspace.git" }
# mcp-coder = { git = "https://github.com/MarcusJellinghaus/mcp_coder.git" }

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
tag_regex = '^(?P<version>\d+\.\d+\.\d+)$'
# Version is automatically determined from git tags
# Tag format: 0.1.0 -> version 0.1.0
# Between releases: 0.1.0.devN+gHASH (includes commit count and hash)
